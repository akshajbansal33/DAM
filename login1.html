<!DOCTYPE html>
<html lang="en">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: radial-gradient(circle at 10% 20%, rgba(10, 15, 28, 1) 0%, #03050b 100%);
      color: #eef2ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      transition: background 0.3s ease, color 0.3s ease;
    }
    body.light-theme {
      background: radial-gradient(circle at 10% 20%, #f0f4f8 0%, #d9e2ec 100%);
      color: #1a202c;
    }
    body.light-theme .login-card { background: rgba(255, 255, 255, 0.85); border-color: rgba(239,68,68,0.4); }
    body.light-theme .input-group input { background: rgba(255,255,255,0.9); color: #1e293b; }
    body.light-theme .footer-note { color: #475569; }
    body.light-theme .brand-header h1 { background: linear-gradient(135deg, #ef4444, #b91c1c); -webkit-background-clip: text; background-clip: text; }
    body.light-theme .input-group label { color: #475569; }
    .login-card {
      background: rgba(18, 25, 45, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 2rem;
      padding: 2rem 2rem 2.2rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 45px -12px rgba(0,0,0,0.5);
      transition: all 0.25s ease;
      position: relative;
    }
    .login-card:hover { border-color: #ef4444; box-shadow: 0 30px 50px -15px rgba(239,68,68,0.2); }
    .brand-header { text-align: center; margin-bottom: 1.8rem; }
    .dam-logo { background: linear-gradient(145deg, #ef4444, #b91c1c); width: 60px; height: 60px; border-radius: 24px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 2rem; font-weight: 800; color: white; box-shadow: 0 0 15px rgba(239,68,68,0.5); }
    .brand-header h1 { font-size: 1.9rem; font-weight: 700; background: linear-gradient(135deg, #fff, #fca5a5); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .input-group { margin-bottom: 1.5rem; }
    .input-group label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #cbd5e6; margin-bottom: 8px; }
    .input-group input { width: 100%; background: rgba(10,15,28,0.7); border: 1px solid rgba(239,68,68,0.3); border-radius: 60px; padding: 0.9rem 1rem; color: white; outline: none; transition: 0.2s; }
    .input-group input:focus { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,0.2); }
    .login-btn { width: 100%; background: #ef4444; border: none; padding: 0.9rem; border-radius: 60px; font-weight: 700; color: white; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .login-btn:hover { background: #b91c1c; transform: scale(1.01); }
    .message-area { margin-top: 1.2rem; text-align: center; font-size: 0.85rem; min-height: 48px; }
    .footer-note { text-align: center; margin-top: 1.8rem; font-size: 0.7rem; color: #7c8ba0; border-top: 1px solid rgba(239,68,68,0.2); padding-top: 1.2rem; }
    .theme-toggle-icon { position: absolute; top: 1.5rem; right: 1.5rem; cursor: pointer; background: rgba(239,68,68,0.2); border-radius: 40px; padding: 0.5rem 0.8rem; font-size: 1rem; transition: 0.2s; }
    .theme-toggle-icon:hover { background: #ef4444; color: white; }
  </style>
</head>
<body>
<div class="login-card">
  <div id="themeToggleIcon" class="theme-toggle-icon"><i class="fas fa-moon"></i></div>
  <div class="brand-header"><div class="dam-logo">D</div><h1>DAM <span style="color:#ef4444;">//</span> G11</h1><p>secure access · AI & ML cohort</p></div>
  <form id="loginForm">
    <div class="input-group"><label><i class="fas fa-id-card"></i> Student ID</label><input type="text" id="studentId" placeholder="e.g., 2510993037" autocomplete="off" required></div>
    <div class="input-group"><label><i class="fas fa-lock"></i> Password</label><input type="password" id="password" placeholder="Enter your password" required></div>
    <button type="submit" class="login-btn"><i class="fas fa-arrow-right-to-bracket"></i> Login</button>
    <div id="message" class="message-area"></div>
  </form>
  <div class="footer-note"><i class="fas fa-shield-heart"></i> Authorized students only | secured portal</div>
</div>

  const form = document.getElementById('loginForm');
  const messageDiv = document.getElementById('message');
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    const enteredId = document.getElementById('studentId').value.trim();
    const enteredPass = document.getElementById('password').value;
    const matched = students.find(s => s.id === enteredId && s.pass === enteredPass);
    if (matched) {
      const userName = matched.pass.split('@')[0];
      localStorage.setItem('loggedInUser', userName);
      messageDiv.style.color = "#4ade80";

    } else {
      messageDiv.style.color = "#f87171";
      messageDiv.innerHTML = '<i class="fas fa-ban"></i> Access Denied: Incorrect ID or Password.';
      document.getElementById('password').value = '';
    }
  });
  function initThemeLogin() {
    const savedTheme = localStorage.getItem('theme');
    const body = document.body;
    const toggleIcon = document.getElementById('themeToggleIcon');
    if (savedTheme === 'light') { body.classList.add('light-theme'); toggleIcon.innerHTML = '<i class="fas fa-sun"></i>'; }
    else { body.classList.remove('light-theme'); toggleIcon.innerHTML = '<i class="fas fa-moon"></i>'; }
  }
  function toggleThemeLogin() {
    const body = document.body;
    const toggleIcon = document.getElementById('themeToggleIcon');
    if (body.classList.contains('light-theme')) { body.classList.remove('light-theme'); localStorage.setItem('theme', 'dark'); toggleIcon.innerHTML = '<i class="fas fa-moon"></i>'; }
    else { body.classList.add('light-theme'); localStorage.setItem('theme', 'light'); toggleIcon.innerHTML = '<i class="fas fa-sun"></i>'; }
  }
  document.getElementById('themeToggleIcon').addEventListener('click', (e) => { e.preventDefault(); toggleThemeLogin(); });
  initThemeLogin();
</script>
</body>
</html>
